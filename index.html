<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omnibus | Store</title>
  <style>
    :root {
      --bg: #e9ecef;
      --surface: #f4f5f7;
      --card: #f8f9fa;
      --text: #1f2428;
      --muted: #5c6670;
      --border: #d1d7de;
      --accent: #2c353d;
      --accent-hover: #1a2026;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .search-box {
      flex: 1;
      max-width: 340px;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .filter-bar {
      max-width: 1100px;
      margin: 1.25rem auto 0.5rem;
      padding: 0 1.25rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.45rem 0.95rem;
      border: 1px solid var(--border);
      background-color: var(--surface);
      color: var(--muted);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background-color: var(--accent);
      color: #f8f9fa;
      border-color: var(--accent);
    }

    main {
      max-width: 1100px;
      width: 100%;
      margin: 1rem auto 3rem;
      padding: 0 1.25rem;
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
    }

    .product-img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background-color: #dce1e6;
      display: block;
    }

    .product-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-cat {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .product-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1rem;
      flex: 1;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn {
      padding: 0.5rem 1rem;
      background-color: var(--accent);
      color: #f8f9fa;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: var(--danger);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      margin-top: 0.6rem;
      width: 100%;
    }

    #admin-panel {
      display: none;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    #admin-panel h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
    }

    .form-group input,
    .form-group select {
      padding: 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 28, 0.55);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
    }

    .modal {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      padding: 1.5rem;
    }

    .modal h3 {
      margin-bottom: 0.4rem;
    }

    .modal p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--bg);
    }

    footer {
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .owner-link {
      background: none;
      border: none;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">Omnibus</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search items..." onkeyup="renderProducts()" />
      </div>
    </div>
  </header>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
    <button class="filter-btn" onclick="setCategory('Apparel', this)">Apparel</button>
    <button class="filter-btn" onclick="setCategory('Accessories', this)">Accessories</button>
    <button class="filter-btn" onclick="setCategory('Digital', this)">Digital</button>
    <button class="filter-btn" onclick="setCategory('Other', this)">Other</button>
  </div>

  <main>
    <section id="admin-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h2>Add New Item to Omnibus</h2>
        <button class="btn btn-secondary" onclick="logoutAdmin()">Close Panel</button>
      </div>
      <form id="addProductForm" onsubmit="addProduct(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Item Name *</label>
            <input type="text" id="pName" placeholder="e.g., Custom Heavyweight Tee" required />
          </div>
          <div class="form-group">
            <label>Price ($) *</label>
            <input type="number" id="pPrice" step="0.01" min="0" placeholder="25.00" required />
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="pCategory">
              <option value="Apparel">Apparel</option>
              <option value="Accessories">Accessories</option>
              <option value="Digital">Digital</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Upload Photo *</label>
            <input type="file" id="pImage" accept="image/*" required />
          </div>
          <div class="form-group">
            <label>Short Description</label>
            <input type="text" id="pDesc" placeholder="Sizes S-XL, washed slate gray" />
          </div>
          <div class="form-group">
            <label>Payment Link (Optional)</label>
            <input type="url" id="pLink" placeholder="https://buy.stripe.com/..." />
          </div>
        </div>
        <button type="submit" class="btn">Publish Item to Store</button>
      </form>
    </section>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <div class="modal-backdrop" id="orderModal">
    <div class="modal">
      <h3 id="modalTitle">Order Item</h3>
      <p id="modalPrice"></p>
      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Your Name</label>
        <input type="text" id="buyerName" placeholder="Enter your name" />
      </div>
      <div class="form-group" style="margin-bottom:0.75rem;">
        <label>Contact (Instagram, Phone, or Email)</label>
        <input type="text" id="buyerContact" placeholder="@username or phone number" />
      </div>
      <div class="form-group">
        <label>Notes (Size, Pickup/Delivery)</label>
        <input type="text" id="buyerNotes" placeholder="e.g., Size Large, cash at school" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="submitOrder()">Request Order</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; <span id="year"></span> Omnibus. All rights reserved.
    <button class="owner-link" onclick="loginAdmin()">Owner Login</button>
  </footer>

  <script>
    const ADMIN_PIN = "1234";

    let isAdmin = false;
    let currentCategory = "All";
    let selectedProduct = null;

    const svgPlaceholder1 = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9e9e7"/><stop offset="1" stop-color="#c5c7c6"/></linearGradient>
        <linearGradient id="cloth" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#191a1b"/><stop offset=".55" stop-color="#090a0b"/><stop offset="1" stop-color="#030404"/></linearGradient>
        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f3ef"/><stop offset=".48" stop-color="#aeb2b1"/><stop offset="1" stop-color="#e5e5df"/></linearGradient>
        <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
      </defs>
      <rect width="600" height="450" fill="url(#bg)"/>
      <ellipse cx="300" cy="381" rx="205" ry="18" fill="#252729" opacity=".2" filter="url(#shadow)"/>
      <g>
        <path d="M148 112l22-12h20l22 12 27 10 30 31-18 31-21-10 7 130H119l7-130-21 10-18-31 30-31z" fill="url(#cloth)" stroke="#242627" stroke-width="2"/>
        <path d="M151 111c-1-30 57-30 58 0l-13 27h-32z" fill="#17191a" stroke="#292b2c" stroke-width="2"/>
        <path d="M160 111c8 15 32 15 40 0l-8 24h-24z" fill="#050606"/>
        <path d="M120 159l24 12M240 159l-24 12M132 177l-5 107M228 177l5 107M144 116l16 21M212 116l-16 21" fill="none" stroke="#303233" stroke-width="2" opacity=".7"/>
        <path d="M142 245c0-8 7-14 15-14h44c8 0 15 6 15 14l-8 29h-58z" fill="#080909" stroke="#292b2c" stroke-width="2"/>
        <path d="M143 245l14 10h44l14-10M180 139v91" fill="none" stroke="#202223" stroke-width="2"/>
        <g transform="rotate(-8 185 202)" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path id="tagMark" d="M139 203c1-8 5-12 10-10s5 9 2 14c-4 6-10 7-13 2z M155 210l3-17 7 9 8-12-1 18 M176 208l4-16 10 13 4-17 M199 192l-2 16 M204 208l2-18c9-3 12 4 5 9 9-1 9 7 0 9z M218 190l-3 12c-1 7 7 10 11 3 2-4 2-10 4-15 M236 192c-4-4-11-3-13 2-2 4 2 5 7 6s5 5 1 8c-4 3-9 2-11-1"/>
          <use href="#tagMark" stroke="#030404" stroke-width="5.5"/>
          <use href="#tagMark" stroke="url(#ink)" stroke-width="2.5"/>
          <path d="M134 218c25 5 59 0 94-12l-10 10 22-10" stroke="url(#ink)" stroke-width="2.8"/>
          <path d="M148 210l-1 6M193 207l1 5M221 205l2 5" stroke="url(#ink)" stroke-width="1.8"/>
          <path d="M131 195l6-3M131 201l4-1M238 181l4-4M240 185l5-2" stroke="url(#ink)" stroke-width="1.8"/>
        </g>
        <circle cx="142" cy="188" r="1.5" fill="#e5e5df"/>
        <circle cx="244" cy="190" r="1.2" fill="#aeb2b1"/>
        <path d="M125 289h110" stroke="#303233" stroke-width="3"/>
      </g>
      <g transform="translate(240 0)">
        <ellipse cx="180" cy="108" rx="39" ry="24" fill="none" stroke="url(#ink)" stroke-width="2.5"/>
        <ellipse cx="180" cy="108" rx="46" ry="29" fill="none" stroke="#f2f1ec" stroke-width="1" opacity=".5"/>
        <path d="M148 112l22-12h20l22 12 27 10 30 31-18 31-21-10 7 130H119l7-130-21 10-18-31 30-31z" fill="url(#cloth)" stroke="#242627" stroke-width="2"/>
        <path d="M151 111c-1-30 57-30 58 0l-13 27h-32z" fill="#17191a" stroke="#292b2c" stroke-width="2"/>
        <path d="M160 111c8 15 32 15 40 0l-8 24h-24z" fill="#050606"/>
        <path d="M120 159l24 12M240 159l-24 12M132 177l-5 107M228 177l5 107M144 116l16 21M212 116l-16 21" fill="none" stroke="#303233" stroke-width="2" opacity=".7"/>
        <text x="180" y="212" fill="none" stroke="#030404" stroke-width="8" stroke-linejoin="round" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-size="19" font-weight="900" letter-spacing=".1" text-anchor="middle">OMNIBUS</text>
        <text x="180" y="212" fill="url(#ink)" stroke="#737879" stroke-width="1.5" paint-order="stroke" font-family="Arial Rounded MT Bold, Trebuchet MS, sans-serif" font-size="19" font-weight="900" letter-spacing=".1" text-anchor="middle">OMNIBUS</text>
        <path d="M146 222c18 7 50 7 68 0M155 238c12 5 38 5 50 0" fill="none" stroke="#353839" stroke-width="2"/>
        <path d="M180 255l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="url(#ink)" opacity=".9"/>
        <path d="M125 289h110" stroke="#303233" stroke-width="3"/>
      </g>
      <text x="180" y="326" fill="#626769" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">FRONT</text>
      <text x="420" y="326" fill="#626769" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3" text-anchor="middle">BACK</text>
    </svg>`);
    const svgPlaceholder2 = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450"><rect fill="#cfd5dc" width="600" height="450"/><text fill="#2c353d" font-family="sans-serif" font-size="28" font-weight="bold" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">Sticker Pack</text></svg>');

    const defaultProducts = [
      {
        id: 1,
        name: "Omnibus Fallen Angel Hoodie",
        price: "35.00",
        category: "Apparel",
        desc: "All-black oversized fleece with a handstyle Omnibus chest tag, bubble-letter back print, and halo hood detail.",
        image: svgPlaceholder1,
        link: ""
      },
      {
        id: 2,
        name: "Matte Vinyl Sticker Pack",
        price: "5.00",
        category: "Accessories",
        desc: "Set of 4 weatherproof matte stickers for laptops and bottles.",
        image: svgPlaceholder2,
        link: ""
      }
    ];

    let products = JSON.parse(localStorage.getItem("omnibus_products")) || defaultProducts;

    const fallenAngelHoodie = products.find(p => p.id === 1);
    if (
      fallenAngelHoodie &&
      (fallenAngelHoodie.name === "Omnibus Essential Hoodie" ||
        fallenAngelHoodie.image.includes("M300%20194v151M248%20246h104") ||
        fallenAngelHoodie.image.includes("M293%20187l7-12") ||
        fallenAngelHoodie.image.includes("Brush%20Script%20MT"))
    ) {
      fallenAngelHoodie.name = "Omnibus Fallen Angel Hoodie";
      fallenAngelHoodie.desc = "All-black oversized fleece with a handstyle Omnibus chest tag, bubble-letter back print, and halo hood detail.";
      fallenAngelHoodie.image = svgPlaceholder1;
      saveProducts();
    }

    document.getElementById("year").textContent = new Date().getFullYear();

    function saveProducts() {
      localStorage.setItem("omnibus_products", JSON.stringify(products));
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const query = document.getElementById("searchInput").value.toLowerCase();
      grid.innerHTML = "";

      const filtered = products.filter(p => {
        const matchesCat = currentCategory === "All" || p.category === currentCategory;
        const matchesSearch =
          p.name.toLowerCase().includes(query) ||
          (p.desc && p.desc.toLowerCase().includes(query));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-msg">No items found matching your search.</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";

        const actionButton = p.link
          ? `<a href="${p.link}" target="_blank" rel="noopener" class="btn">Buy Now</a>`
          : `<button class="btn" onclick="openOrderModal(${p.id})">Buy / Request</button>`;

        const deleteButton = isAdmin
          ? `<button class="btn btn-danger" onclick="deleteProduct(${p.id})">Remove Item</button>`
          : "";

        card.innerHTML = `
          <img src="${p.image}" alt="${p.name}" class="product-img" />
          <div class="product-info">
            <div class="product-cat">${p.category}</div>
            <div class="product-title">${p.name}</div>
            <div class="product-desc">${p.desc || ""}</div>
            <div class="product-bottom">
              <div class="product-price">$${Number(p.price).toFixed(2)}</div>
              ${actionButton}
            </div>
            ${deleteButton}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function loginAdmin() {
      const entered = prompt("Enter Owner PIN:");
      if (entered === ADMIN_PIN) {
        isAdmin = true;
        document.getElementById("admin-panel").style.display = "block";
        renderProducts();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (entered !== null) {
        alert("Incorrect PIN.");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById("admin-panel").style.display = "none";
      renderProducts();
    }

    function addProduct(event) {
      event.preventDefault();
      const name = document.getElementById("pName").value.trim();
      const price = document.getElementById("pPrice").value;
      const category = document.getElementById("pCategory").value;
      const desc = document.getElementById("pDesc").value.trim();
      const link = document.getElementById("pLink").value.trim();
      const fileInput = document.getElementById("pImage");

      if (!fileInput.files || !fileInput.files[0]) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const newProduct = {
          id: Date.now(),
          name,
          price,
          category,
          desc,
          link,
          image: e.target.result
        };

        products.unshift(newProduct);
        saveProducts();
        document.getElementById("addProductForm").reset();
        renderProducts();
        alert("Item added to Omnibus!");
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    function deleteProduct(id) {
      if (!confirm("Remove this item from Omnibus?")) return;
      products = products.filter(p => p.id !== id);
      saveProducts();
      renderProducts();
    }

    function openOrderModal(id) {
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;
      document.getElementById("modalTitle").textContent = selectedProduct.name;
      document.getElementById("modalPrice").textContent = `Price: $${Number(selectedProduct.price).toFixed(2)}`;
      document.getElementById("orderModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    function submitOrder() {
      const name = document.getElementById("buyerName").value.trim();
      const contact = document.getElementById("buyerContact").value.trim();
      const notes = document.getElementById("buyerNotes").value.trim();

      if (!name || !contact) {
        alert("Please enter your name and contact info.");
        return;
      }

      const subject = encodeURIComponent(`Omnibus Order: ${selectedProduct.name}`);
      const body = encodeURIComponent(
        `Item: ${selectedProduct.name} ($${Number(selectedProduct.price).toFixed(2)})\nBuyer: ${name}\nContact: ${contact}\nNotes: ${notes}`
      );
      window.location.href = `mailto:youremail@example.com?subject=${subject}&body=${body}`;
      closeModal();
    }

    renderProducts();
  </script>
</body>
</html>
